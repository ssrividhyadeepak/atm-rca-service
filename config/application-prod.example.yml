# Non-secret prod settings that differ from the samples. Copy to config/application-prod.yml
# (gitignored) in the folder the jar is started from; Spring Boot picks it up with the prod
# profile. Secrets and URLs stay in environment variables (config/prod.env.example).

rca:
  monitor:
    # Failures of these transactions are monitored: the values your Splunk field takes
    transactions: [cash-withdrawal, cash-deposit, balance-inquiry]

  splunk:
    searches:
      # Must return, oldest first: ts, service, transaction, correlationId, terminal,
      # exception, message, stackTrace (terminal and stackTrace may be missing).
      # $index$, $transactions$ (rendered as "a","b") and $limit$ are filled in by the service.
      # The field names on the left of each rename are examples - use your own.
      failed_transactions: >-
        search index=$index$ "*exception*" txn_name IN ($transactions$)
        | sort 0 _time
        | head $limit$
        | rename txn_name as transaction, app as service, corrId as correlationId, atm_id as terminal
        | rex field=_raw "(?<exception>[\w.$]+(?:Exception|Error))"
        | rex field=_raw "^(?<message>[^\r\n]+)"
        | eval ts=_time, stackTrace=_raw
        | table ts service transaction correlationId terminal exception message stackTrace
      # Or, if the search is kept in Splunk as a saved search:
      # failed_transactions: >-
      #   | savedsearch "atm_failed_transactions"
