# Non-secret prod settings that differ from the samples. Copy to config/application-prod.yml
# (gitignored) in the folder the jar is started from; Spring Boot picks it up with the prod
# profile. Secrets and URLs stay in environment variables (config/prod.env.example).

rca:
  # parser:
  #   # The label in front of the id on your UI events, if it is not "BANK ID"
  #   id-label: "BANK ID"

  monitor:
    # The Kubernetes namespace of your application (kubernetes.namespace_name in the events)
    namespace: your-namespace
    # The containers to monitor (kubernetes.container_name; '*' is a wildcard) and the
    # transaction label each one's failures are reported under
    components:
      - pattern: "app-yourapp-withdrawal-*"
        transaction: cash-withdrawal
      - pattern: "app-yourapp-deposit-*"
        transaction: cash-deposit
      - pattern: "app-yourapp-balance-*"
        transaction: balance-inquiry

  # Only needed when the code is in more than one repository. Each one is mirrored from
  # 'remote-url' (with GIT_TOKEN), or read from an existing clone at 'path'. 'components' says
  # which containers' code lives there; a repository without it is tried for every component.
  # source:
  #   deployed-ref: main
  #   repositories:
  #     - name: withdrawal
  #       remote-url: https://git.example.com/bank/withdrawal-service.git
  #       components: ["app-yourapp-withdrawal-*"]
  #     - name: deposit
  #       remote-url: https://git.example.com/bank/deposit-service.git
  #       deployed-ref: release/2026.10
  #       components: ["app-yourapp-deposit-*"]

  # Only needed if the default search does not fit, for example another exception filter.
  # It must return ts and _raw; the service extracts the fields from the raw event.
  # splunk:
  #   searches:
  #     failed_transactions: >-
  #       search index=$index$ "*exception*" kubernetes.namespace_name="$namespace$"
  #       kubernetes.container_name IN ($components$)
  #       | sort 0 _time
  #       | head $limit$
  #       | eval ts=_time
  #       | table ts _raw
