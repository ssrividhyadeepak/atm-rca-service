# Tests start runs themselves; the schedule stays off
rca:
  log-dir: build/test-data/logs
  knowledge:
    # Fast and model-free; KnowledgeEvalTest covers the embedding mode
    mode: keyword
  input-dir: build/test-data/rca-input
  monitor:
    enabled: false
    run-on-startup: false
  stub:
    # Fixed clock so the synthetic day, and every count, is reproducible
    anchor: 2026-10-02T00:00:00Z
