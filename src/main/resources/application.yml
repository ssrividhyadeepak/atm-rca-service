# ---------------------------------------------------------------------------
# ATM RCA service
#
#   no profile      LOCAL: everything runs on this machine with in-memory storage and sample
#                   data. No MongoDB, no Splunk, no credentials.
#   profile 'prod'  ENTERPRISE: real connections, configured through environment variables
#                   (see README and config/prod.env.example). The service refuses to start
#                   if a required setting is missing or a connection cannot be made.
# ---------------------------------------------------------------------------
spring:
  application:
    name: atm-rca-service
  main:
    banner-mode: off

server:
  # Local only by default
  address: ${RCA_BIND_ADDRESS:127.0.0.1}
  port: ${RCA_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

rca:
  # memory = runs are kept in this process and lost on restart; mongo = MongoDB
  storage: ${RCA_STORAGE:memory}
  mongo:
    # Connection string, e.g. mongodb+srv://user:password@cluster.example.com/?tls=true
    # From the environment only - it contains credentials. Never put it in this file.
    uri: ${MONGODB_URI:}
    database: ${MONGODB_DATABASE:atm_rca}
  monitor:
    # The scheduled monitoring run
    enabled: ${RCA_MONITOR_ENABLED:true}
    cron: "${RCA_MONITOR_CRON:0 */15 * * * *}"   # every 15 minutes
    # Also run once when the service starts, so a wrong Splunk setting shows immediately
    run-on-startup: true
    # How far back each run looks
    window: 24h
    # Failures of these transactions are monitored: the values of the 'transaction' field
    transactions: [cash-withdrawal, cash-deposit, balance-inquiry]
  splunk:
    # stub = synthetic events, no Splunk needed; live = your Splunk over its REST API.
    # The prod profile always uses live.
    mode: ${SPLUNK_MODE:stub}
    # Management URL (port 8089 by default), not the web UI address. Must be https.
    base-url: ${SPLUNK_URL:}
    # Credentials from the environment only. A Splunk authentication token (Settings > Tokens)
    # is preferred; with single sign-on it is the only option.
    token: ${SPLUNK_TOKEN:}
    username: ${SPLUNK_USERNAME:}
    password: ${SPLUNK_PASSWORD:}
    index: ${SPLUNK_INDEX:main}
    timeout: 60s
    # Most rows one search may return
    max-rows: 1000
    # The SPL behind each named search. $index$, $transactions$ (rendered as "a","b") and
    # $limit$ are filled in by the service after validation. Each row must have the fields
    # ts, service, transaction, correlationId, terminal, exception, message, stackTrace -
    # add rename / rex / eval where your field names differ. To use a saved search instead:
    #   | savedsearch "atm_failed_transactions"
    searches:
      failed_transactions: >-
        search index=$index$ "*exception*" transaction IN ($transactions$)
        | sort 0 _time
        | head $limit$
        | eval ts=_time
        | table ts service transaction correlationId terminal exception message stackTrace

---
spring:
  config:
    activate:
      on-profile: prod

rca:
  storage: mongo
  splunk:
    mode: live
